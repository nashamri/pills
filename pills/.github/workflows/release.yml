name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: pills

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: pills/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential

      - name: Add MinGW to PATH (Windows)
        if: matrix.platform == 'windows'
        run: echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: wails build -tags webkit2_41

      - name: Build (macOS)
        if: matrix.platform == 'darwin'
        run: wails build

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: wails build -webview2 embed

      - name: Package artifact (Linux)
        if: matrix.platform == 'linux'
        run: mv build/bin/pills build/bin/pills-linux

      - name: Package artifact (macOS)
        if: matrix.platform == 'darwin'
        run: cd build/bin && zip -r pills-macos.zip pills.app

      - name: Package artifact (Windows)
        if: matrix.platform == 'windows'
        run: mv build/bin/pills.exe build/bin/pills-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pills-${{ matrix.platform }}
          path: pills/build/bin/pills-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pills-linux
            artifacts/pills-macos.zip
            artifacts/pills-windows.exe